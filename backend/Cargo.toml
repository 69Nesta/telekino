[package]
name = "telekino"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
enigo = "0.6.1"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
